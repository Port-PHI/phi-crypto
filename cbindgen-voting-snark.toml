# cbindgen configuration for the `voting_snark` build's C-ABI header.
#
# Identical to cbindgen.toml except for the include guard. The two headers declare overlapping symbol
# sets — the featured header is the default one plus `phi_voting_verify_vote_v1` — so sharing a guard
# would make whichever is included second expand to nothing, silently removing the gated declaration
# from that translation unit. Each header therefore owns its own guard, and regenerating with this
# config preserves that.
#
# Generate: cargo build --release --features voting_snark \
#           && cbindgen --config cbindgen-voting-snark.toml --output phi_crypto_voting_snark.h
language = "C"
include_guard = "PHI_CRYPTO_VOTING_SNARK_H"
tab_width = 4
documentation = true
documentation_style = "c"
autogen_warning = "/* Warning: this file is generated by cbindgen — do not edit manually. */"

[parse]
parse_deps = false

[export]
prefix = ""
# Only the extern "C" functions of the ffi module.
